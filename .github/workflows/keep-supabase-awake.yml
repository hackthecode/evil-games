# Безплатният план на Supabase спира проекта след 7 дни без заявки.
# На всеки 2 дни правим една лека заявка, за да остане буден.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o "url: '[^']*'" config.js | head -1 | cut -d"'" -f2)
          KEY=$(grep -o "anonKey: '[^']*'" config.js | head -1 | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/leaderboard?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase отговори: $code"
          test "$code" = "200"
