<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · Evil Games</title>
  <style>body { background: #0b0b0e; color: #e8e8ee; font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 16px; } .bad { color: #ff6b78; } .good { color: #4fd18b; }</style>
</head>
<body>
  <h1>Tests</h1>
  <pre id="out">Running…</pre>
  <script type="module">
    const out = document.getElementById('out');
    out.textContent = '';
    const { run } = await import('./all.js');
    const { failed } = await run((line) => { out.textContent += line + '\n'; });
    document.title = (failed ? '✗ ' : '✓ ') + document.title;
    out.className = failed ? 'bad' : 'good';
  </script>
</body>
</html>
